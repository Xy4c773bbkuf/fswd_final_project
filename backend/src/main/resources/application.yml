spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/skillswap?createDatabaseIfNotExist=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
server:
  port: 8080
jwt:
  secret: ${JWT_SECRET:local-development-secret-change-me-at-least-32-characters}
  expiration-hours: 24
